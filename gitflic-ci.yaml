# GitFlic CI/CD. Конфиг — gitflic-ci.yaml в корне репозитория.
# Запускается автоматически на push и merge request.
image: golang:1.22

variables:
  GOFLAGS: "-mod=mod"
  CGO_ENABLED: "1"
  # Держим GOPATH/GOCACHE внутри рабочей директории задачи: GitFlic умеет
  # кэшировать только файлы внутри неё (по умолчанию GOPATH=/go, он вне).
  GOPATH: "$CI_PROJECT_DIR/.gopath"
  GOCACHE: "$CI_PROJECT_DIR/.gocache"

# Общий кэш конвейера: скачанные модули и результаты сборки переиспользуются
# между запусками (cache — глобальное ключевое слово, действует для всех задач).
cache:
  key:
    - go
    - modules
  paths:
    - .gopath/pkg/mod
    - .gocache

stages:
  - test
  - build

# Проверка форматирования: код должен быть gofmt-чистым.
gofmt:
  stage: test
  script:
    - files=$(gofmt -l .) && test -z "$files" || { echo "Не отформатировано gofmt:"; echo "$files"; exit 1; }

vet:
  stage: test
  script:
    - go vet ./...

# -race важен для sender: там конкурентная очередь и shutdown.
test:
  stage: test
  script:
    - go test -race -count=1 ./...

build:
  stage: build
  script:
    - go build ./...
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
