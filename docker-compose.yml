services:
  app:
    build: .
    container_name: 2mon
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"


  mongo:
    image: mongo:7.0
    container_name: 2mon-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
