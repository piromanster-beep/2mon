# Зоны limit_req ниже используются в этом файле (webhook/admin), но
# объявляются они только в контексте http{} — в основном nginx.conf или
# в отдельном сниппете, подключаемом из http{}. Если их ещё нет на
# сервере, добавьте в http{} что-то вроде (значения — как в SECURITY.md):
#
#   limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;
#
# Не добавляйте их в этот файл повторно, если они уже есть в http{}:
# nginx не примет два определения одной зоны.
server {
    listen 443 ssl;
    server_name 2mon.ru;
    # Заголовки безопасности
    
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    ssl_certificate /etc/letsencrypt/live/2mon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2mon.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /bot {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /wh/ {
	limit_req zone=webhook burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
	limit_req zone=admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name 2mon.ru;
    return 301 https://$host$request_uri;
}
